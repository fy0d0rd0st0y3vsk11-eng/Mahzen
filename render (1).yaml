services:
  - type: web
    name: mahzen-fedya
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:web --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DISCORD_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODEL
        value: openrouter/auto
      - key: AI_SITE_URL
        value: https://mahzen-fedya.onrender.com
      - key: AI_SITE_NAME
        value: Mahzen | Fedya
      - key: TIMEZONE
        value: Europe/Istanbul
      - key: OWNER_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DATABASE_PATH
        value: data/mahzen.db
